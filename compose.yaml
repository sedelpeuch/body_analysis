name: body-analysis

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: body_analysis
      POSTGRES_USER: body
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodypass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U body -d body_analysis"]
      interval: 5s
      timeout: 5s
      retries: 12

  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: body_analysis_test
      POSTGRES_USER: body
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodypass}
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U body -d body_analysis_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      BA_DATABASE_URL: postgresql+asyncpg://body:${POSTGRES_PASSWORD:-bodypass}@db:5432/body_analysis
      BA_TEST_DATABASE_URL: postgresql+asyncpg://body:${POSTGRES_PASSWORD:-bodypass}@test-db:5432/body_analysis_test
      BA_MINIO_ENDPOINT: minio:9000
      BA_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      BA_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BA_MINIO_BUCKET: body-analysis-photos
      BA_MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db_data:
  test_db_data:
  minio_data:
