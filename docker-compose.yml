version: '3.8'

services:
  body-analysis:
    image: body-analysis:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - body-analysis-network

networks:
  body-analysis-network:
    driver: overlay
    attachable: true
