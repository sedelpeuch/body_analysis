name: Build and Push Docker image to GHCR

on:
    push:
        branches: [master]

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push api image
              uses: docker/build-push-action@v5
              with:
                  context: backend
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/body-analysis-api:latest
                      ghcr.io/${{ github.repository_owner }}/body-analysis-api:${{ github.sha }}

            - name: Build and push web image
              uses: docker/build-push-action@v5
              with:
                  context: frontend
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/body-analysis-web:latest
                      ghcr.io/${{ github.repository_owner }}/body-analysis-web:${{ github.sha }}
